name: 🛠️ Build AYON launcher

on:
  release:
    types: [published]
  workflow_call:
    inputs:
      tag_name:
        description: 'Tag name'
        required: true
        type: string
      enable_macos_signing:
        description: 'Enable macOS signing and notarization'
        required: false
        default: false
        type: boolean
      enable_windows_signing:
        description: 'Enable Windows code signing'
        required: false
        default: false
        type: boolean
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag name'
        required: true
        type: string
      enable_macos_signing:
        description: 'Enable macOS signing and notarization'
        required: false
        default: false
        type: boolean
      enable_windows_signing:
        description: 'Enable Windows code signing'
        required: false
        default: false
        type: boolean

jobs:
  build-linux:
    name: Build (${{ matrix.variant }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: ubuntu
          - variant: debian
          - variant: rocky8
          - variant: rocky9

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag_name || github.ref }}
          submodules: recursive

      - name: Set up Docker
        uses: docker/setup-buildx-action@v3

      - name: Run Docker Build
        shell: bash
        run: |
          chmod +x ./tools/make.sh
          ./tools/make.sh docker-build ${{ matrix.variant }}

      - name: Upload to Release
        uses: softprops/action-gh-release@v1
        with:
          files: build_${{ matrix.variant }}/installer/*
          tag_name: ${{ inputs.tag_name || '' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-windows:
    name: Build (Windows)
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag_name || github.ref }}
          submodules: recursive

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Create Environment
        run: |
          powershell -File ./tools/manage.ps1 create-env

      - name: Install Runtime Dependencies
        run: |
          powershell -File ./tools/manage.ps1 install-runtime

      - name: Import Windows code signing certificate
        if: ${{ github.event_name == 'release' || inputs.enable_windows_signing == true }}
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
        run: |
          $cert_bytes = [System.Convert]::FromBase64String($env:WINDOWS_CERTIFICATE)
          [System.IO.File]::WriteAllBytes("$env:GITHUB_WORKSPACE\cert.pfx", $cert_bytes)

      - name: Build shim
        shell: pwsh
        run: |
          Push-Location shim
          cargo build -p shim --features gui --release
          cargo build -p shim --features ayon_console --release
          Pop-Location

      - name: Sign shim executables
        if: ${{ github.event_name == 'release' || inputs.enable_windows_signing == true }}
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          $signtool = Get-ChildItem -Path "C:\Program Files (x86)\Windows Kits\10\bin" `
            -Filter "signtool.exe" -Recurse |
            Sort-Object FullName -Descending |
            Select-Object -First 1 -ExpandProperty FullName
          & $signtool sign /f "$env:GITHUB_WORKSPACE\cert.pfx" `
            /p $env:WINDOWS_CERTIFICATE_PASSWORD `
            /tr http://timestamp.digicert.com /td sha256 /fd sha256 `
            "shim\target\release\ayon.exe" `
            "shim\target\release\ayon_console.exe"

      - name: Build AYON
        shell: pwsh
        run: |
          if (-not (Test-Path "build")) { New-Item -ItemType Directory -Path "build" }
          uv --no-color pip freeze > "build\requirements.txt"
          uv run python "tools\_venv_deps.py"
          & .venv\Scripts\python setup.py build

      - name: Sign AYON executables
        if: ${{ github.event_name == 'release' || inputs.enable_windows_signing == true }}
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          $signtool = Get-ChildItem -Path "C:\Program Files (x86)\Windows Kits\10\bin" `
            -Filter "signtool.exe" -Recurse |
            Sort-Object FullName -Descending |
            Select-Object -First 1 -ExpandProperty FullName
          & $signtool sign /f "$env:GITHUB_WORKSPACE\cert.pfx" `
            /p $env:WINDOWS_CERTIFICATE_PASSWORD `
            /tr http://timestamp.digicert.com /td sha256 /fd sha256 `
            "build\output\ayon.exe" `
            "build\output\ayon_console.exe"

      - name: Post-process build
        shell: pwsh
        run: |
          uv run python "tools\build_post_process.py" "build"

      - name: Sign shim installer
        if: ${{ github.event_name == 'release' || inputs.enable_windows_signing == true }}
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          $signtool = Get-ChildItem -Path "C:\Program Files (x86)\Windows Kits\10\bin" `
            -Filter "signtool.exe" -Recurse |
            Sort-Object FullName -Descending |
            Select-Object -First 1 -ExpandProperty FullName
          & $signtool sign /f "$env:GITHUB_WORKSPACE\cert.pfx" `
            /p $env:WINDOWS_CERTIFICATE_PASSWORD `
            /tr http://timestamp.digicert.com /td sha256 /fd sha256 `
            "build\output\shim\shim.exe"

      - name: Make AYON installer
        shell: pwsh
        run: |
          uv run python "tools\build_post_process.py" "make-installer"

      - name: Sign AYON installer
        if: ${{ github.event_name == 'release' || inputs.enable_windows_signing == true }}
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          $signtool = Get-ChildItem -Path "C:\Program Files (x86)\Windows Kits\10\bin" `
            -Filter "signtool.exe" -Recurse |
            Sort-Object FullName -Descending |
            Select-Object -First 1 -ExpandProperty FullName
          $installer = Get-ChildItem -Path "build\installer\*.exe" |
            Select-Object -First 1 -ExpandProperty FullName
          & $signtool sign /f "$env:GITHUB_WORKSPACE\cert.pfx" `
            /p $env:WINDOWS_CERTIFICATE_PASSWORD `
            /tr http://timestamp.digicert.com /td sha256 /fd sha256 `
            $installer

      - name: Remove signing certificate
        if: always()
        shell: pwsh
        run: |
          $certPath = "$env:GITHUB_WORKSPACE\cert.pfx"
          if (Test-Path $certPath) { Remove-Item $certPath -Force }

      - name: Upload to Release
        uses: softprops/action-gh-release@v1
        with:
          files: build/installer/*
          tag_name: ${{ inputs.tag_name || '' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-macos:
    name: Build (macOS)
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag_name || github.ref }}
          submodules: recursive

      - name: Install Homebrew dependencies
        run: brew install cmake create-dmg

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Import code signing certificate
        if: ${{ github.event_name == 'release' || inputs.enable_macos_signing == true }}
        uses: apple-actions/import-codesign-certs@v3
        with:
          p12-file-base64: ${{ secrets.APPLE_DEVELOPER_ID_CERTIFICATE }}
          p12-password: ${{ secrets.APPLE_DEVELOPER_ID_PASSWORD }}

      - name: Set up notarization keychain profile
        if: ${{ github.event_name == 'release' || inputs.enable_macos_signing == true }}
        env:
          APPLE_NOTARIZE_APPLE_ID: ${{ secrets.APPLE_NOTARIZE_APPLE_ID }}
          APPLE_NOTARIZE_PASSWORD: ${{ secrets.APPLE_NOTARIZE_PASSWORD }}
          APPLE_NOTARIZE_TEAM_ID: ${{ secrets.APPLE_NOTARIZE_TEAM_ID }}
        run: |
          xcrun notarytool store-credentials "ayon-notarize-ci" \
            --apple-id "$APPLE_NOTARIZE_APPLE_ID" \
            --password "$APPLE_NOTARIZE_PASSWORD" \
            --team-id "$APPLE_NOTARIZE_TEAM_ID"

      - name: Create environment
        run: |
          chmod +x ./tools/make.sh
          ./tools/make.sh create-env

      - name: Install runtime dependencies
        run: ./tools/make.sh install-runtime

      - name: Build and make installer
        env:
          AYON_APPLE_SIGN_IDENTITY: ${{ secrets.APPLE_SIGN_IDENTITY }}
          AYON_APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          AYON_APPLE_CODESIGN: ${{ (github.event_name == 'release' || inputs.enable_macos_signing == true) && '1' || '0' }}
          AYON_APPLE_NOTARIZE: ${{ (github.event_name == 'release' || inputs.enable_macos_signing == true) && '1' || '0' }}
          AYON_APPLE_NOTARIZE_KEYCHAIN_PROFILE: "ayon-notarize-ci"
        run: ./tools/make.sh build-make-installer

      - name: Upload to Release
        uses: softprops/action-gh-release@v1
        with:
          files: build/installer/*
          tag_name: ${{ inputs.tag_name || '' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
