name: 🛠️ Build AYON launcher

on:
  release:
    types: [published]
  workflow_call:
    inputs:
      tag_name:
        description: 'Tag name'
        required: true
        type: string
      enable_macos_signing:
        description: 'Enable macOS signing and notarization'
        required: false
        default: false
        type: boolean
      enable_windows_signing:
        description: 'Enable Windows code signing'
        required: false
        default: false
        type: boolean
      upload:
        description: >-
          Upload installers to the release. When disabled, installers are
          stored as workflow run artifacts and 'tag_name' can be any git ref.
        required: false
        default: true
        type: boolean
      platforms:
        description: >-
          Comma separated platforms to build (linux, windows, macos).
          Empty or 'all' builds all platforms.
        required: false
        default: ''
        type: string
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag name'
        required: true
        type: string
      enable_macos_signing:
        description: 'Enable macOS signing and notarization'
        required: false
        default: false
        type: boolean
      enable_windows_signing:
        description: 'Enable Windows code signing'
        required: false
        default: false
        type: boolean
      upload:
        description: >-
          Upload installers to the release. When disabled, installers are
          stored as workflow run artifacts and 'tag_name' can be any git ref.
        required: false
        default: true
        type: boolean
      platforms:
        description: 'Platforms to build'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - linux
          - windows
          - macos

jobs:
  build-linux:
    name: Build (${{ matrix.variant }})
    if: ${{ !inputs.platforms || inputs.platforms == 'all' || contains(inputs.platforms, 'linux') }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: ubuntu
          - variant: debian
          - variant: rocky8
          - variant: rocky9

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag_name || github.ref }}
          submodules: recursive

      - name: Set up Docker
        uses: docker/setup-buildx-action@v3

      - name: Run Docker Build
        shell: bash
        run: |
          chmod +x ./tools/make.sh
          ./tools/make.sh docker-build ${{ matrix.variant }}

      - name: Upload as Artifact
        if: ${{ github.event_name != 'release' && !inputs.upload }}
        uses: actions/upload-artifact@v4
        with:
          name: installer-${{ matrix.variant }}
          path: build_${{ matrix.variant }}/installer/*

      - name: Upload to Release
        if: ${{ github.event_name == 'release' || inputs.upload }}
        uses: softprops/action-gh-release@v1
        with:
          files: build_${{ matrix.variant }}/installer/*
          tag_name: ${{ inputs.tag_name || '' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-windows:
    name: Build (Windows)
    if: ${{ !inputs.platforms || inputs.platforms == 'all' || contains(inputs.platforms, 'windows') }}
    runs-on: windows-latest
    env:
      AYON_WINDOWS_CODESIGN: ${{ (inputs.enable_windows_signing == true || (github.event_name == 'release' && vars.WINDOWS_SIGNING_ENABLED == 'true')) && '1' || '0' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag_name || github.ref }}
          submodules: recursive

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Create Environment
        run: |
          powershell -File ./tools/manage.ps1 create-env

      - name: Install Runtime Dependencies
        run: |
          powershell -File ./tools/manage.ps1 install-runtime

      # SSL.com eSigner Cloud Key Adapter (CKA) loads the cloud certificate
      #   into the Windows certificate store, signtool then signs by thumbprint
      - name: Set up SSL.com eSigner CKA
        if: ${{ env.AYON_WINDOWS_CODESIGN == '1' }}
        shell: pwsh
        env:
          ESIGNER_USERNAME: ${{ secrets.ESIGNER_USERNAME }}
          ESIGNER_PASSWORD: ${{ secrets.ESIGNER_PASSWORD }}
          # Base64 encoded, not the Base32 'secret=' value from the QR code
          ESIGNER_TOTP_SECRET: ${{ secrets.ESIGNER_TOTP_SECRET }}
          CKA_URL: https://github.com/SSLcom/eSignerCKA/releases/download/v1.1.2/SSL.COM.eSigner.CKA_1.1.2_build_202600624.exe
          CKA_SHA256: 3f088403139505ddfb0ed3b56b72893f92c865f98b382753a1e1c695a5cece35
        run: |
          foreach ($name in "ESIGNER_USERNAME", "ESIGNER_PASSWORD", "ESIGNER_TOTP_SECRET") {
            if (-not [Environment]::GetEnvironmentVariable($name)) {
              Write-Error "Windows signing is enabled but $name secret is not set"
              exit 1
            }
          }

          $installer = "$env:RUNNER_TEMP\eSignerCKA_setup.exe"
          Invoke-WebRequest -Uri $env:CKA_URL -OutFile $installer
          $hash = (Get-FileHash $installer -Algorithm SHA256).Hash
          if ($hash -ne $env:CKA_SHA256) {
            Write-Error "eSigner CKA installer hash mismatch: $hash"
            exit 1
          }

          # All users install registers the eSignerKSP key storage provider,
          #   without it signtool can't use the certificate private key
          $cka_dir = "$env:RUNNER_TEMP\eSignerCKA"
          Start-Process -FilePath $installer -Wait -ArgumentList `
            "/ALLUSERS", "/VERYSILENT", "/SUPPRESSMSGBOXES", "/DIR=`"$cka_dir`""
          $ksp_key = "HKLM:\SYSTEM\CurrentControlSet\Control\Cryptography\Providers\eSignerKSP"
          if (-not (Test-Path $ksp_key)) {
            Write-Error "eSigner CKA did not register eSignerKSP key storage provider"
            exit 1
          }
          $tool = "$cka_dir\eSignerCKATool.exe"

          & $tool config -mode product `
            -user $env:ESIGNER_USERNAME `
            -pass $env:ESIGNER_PASSWORD `
            -totp $env:ESIGNER_TOTP_SECRET `
            -key "$env:RUNNER_TEMP\eSignerCKA_master.key" -r
          & $tool unload
          & $tool load

          $cert = Get-ChildItem Cert:\CurrentUser\My -CodeSigningCert |
            Sort-Object NotAfter -Descending |
            Select-Object -First 1
          if (-not $cert) {
            Write-Error "No code signing certificate was loaded by eSigner CKA"
            exit 1
          }
          if (-not $cert.HasPrivateKey) {
            Write-Error "Certificate loaded by eSigner CKA has no private key"
            exit 1
          }
          # SSL.com recommends x86 signtool, x64 one can't find CKA certificates
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x86\signtool.exe" |
            Sort-Object { $_.Directory.Parent.Name } -Descending |
            Select-Object -First 1 -ExpandProperty FullName
          if (-not $signtool) {
            Write-Error "x86 signtool.exe was not found"
            exit 1
          }

          Write-Host "Signing with '$($cert.Subject)' ($($cert.Thumbprint)) using $signtool"
          "AYON_WINDOWS_SIGNTOOL=$signtool" >> $env:GITHUB_ENV
          "AYON_WINDOWS_SIGNTOOL_ARGS=/debug /sha1 $($cert.Thumbprint)" >> $env:GITHUB_ENV
          "AYON_WINDOWS_SIGN_TIMESTAMP_URL=http://ts.ssl.com" >> $env:GITHUB_ENV
          "ESIGNER_CKA_TOOL=$tool" >> $env:GITHUB_ENV

      - name: Build and Make Installer
        run: |
          powershell -File ./tools/manage.ps1 build-make-installer

      - name: Remove eSigner CKA configuration
        if: ${{ always() && env.ESIGNER_CKA_TOOL != '' }}
        shell: pwsh
        run: |
          & $env:ESIGNER_CKA_TOOL unload
          Remove-Item "$env:RUNNER_TEMP\eSignerCKA_master.key" -Force -ErrorAction SilentlyContinue

      - name: Upload as Artifact
        if: ${{ github.event_name != 'release' && !inputs.upload }}
        uses: actions/upload-artifact@v4
        with:
          name: installer-windows
          path: build/installer/*

      - name: Upload to Release
        if: ${{ github.event_name == 'release' || inputs.upload }}
        uses: softprops/action-gh-release@v1
        with:
          files: build/installer/*
          tag_name: ${{ inputs.tag_name || '' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-macos:
    name: Build (macOS)
    if: ${{ !inputs.platforms || inputs.platforms == 'all' || contains(inputs.platforms, 'macos') }}
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag_name || github.ref }}
          submodules: recursive

      - name: Install Homebrew dependencies
        run: brew install cmake create-dmg

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Import code signing certificate
        if: ${{ github.event_name == 'release' || inputs.enable_macos_signing == true }}
        uses: apple-actions/import-codesign-certs@v3
        with:
          p12-file-base64: ${{ secrets.APPLE_DEVELOPER_ID_CERTIFICATE }}
          p12-password: ${{ secrets.APPLE_DEVELOPER_ID_PASSWORD }}

      - name: Set up notarization keychain profile
        if: ${{ github.event_name == 'release' || inputs.enable_macos_signing == true }}
        env:
          APPLE_NOTARIZE_APPLE_ID: ${{ secrets.APPLE_NOTARIZE_APPLE_ID }}
          APPLE_NOTARIZE_PASSWORD: ${{ secrets.APPLE_NOTARIZE_PASSWORD }}
          APPLE_NOTARIZE_TEAM_ID: ${{ secrets.APPLE_NOTARIZE_TEAM_ID }}
        run: |
          xcrun notarytool store-credentials "ayon-notarize-ci" \
            --apple-id "$APPLE_NOTARIZE_APPLE_ID" \
            --password "$APPLE_NOTARIZE_PASSWORD" \
            --team-id "$APPLE_NOTARIZE_TEAM_ID"

      - name: Create environment
        run: |
          chmod +x ./tools/make.sh
          ./tools/make.sh create-env

      - name: Install runtime dependencies
        run: ./tools/make.sh install-runtime

      - name: Build and make installer
        env:
          AYON_APPLE_SIGN_IDENTITY: ${{ secrets.APPLE_SIGN_IDENTITY }}
          AYON_APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          AYON_APPLE_CODESIGN: ${{ (github.event_name == 'release' || inputs.enable_macos_signing == true) && '1' || '0' }}
          AYON_APPLE_NOTARIZE: ${{ (github.event_name == 'release' || inputs.enable_macos_signing == true) && '1' || '0' }}
          AYON_APPLE_NOTARIZE_KEYCHAIN_PROFILE: "ayon-notarize-ci"
        run: ./tools/make.sh build-make-installer

      - name: Upload as Artifact
        if: ${{ github.event_name != 'release' && !inputs.upload }}
        uses: actions/upload-artifact@v4
        with:
          name: installer-macos
          path: build/installer/*

      - name: Upload to Release
        if: ${{ github.event_name == 'release' || inputs.upload }}
        uses: softprops/action-gh-release@v1
        with:
          files: build/installer/*
          tag_name: ${{ inputs.tag_name || '' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
