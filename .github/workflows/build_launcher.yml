name: 🛠️ Build AYON launcher

on:
  release:
    types: [published]
  workflow_call:
    inputs:
      tag_name:
        description: 'Tag name'
        required: true
        type: string
      enable_macos_signing:
        description: 'Enable macOS signing and notarization'
        required: false
        default: false
        type: boolean
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag name'
        required: true
        type: string
      enable_macos_signing:
        description: 'Enable macOS signing and notarization'
        required: false
        default: false
        type: boolean

jobs:
  build-linux:
    name: Build (${{ matrix.variant }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: ubuntu
          - variant: debian
          - variant: rocky8
          - variant: rocky9

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag_name || github.ref }}
          submodules: recursive

      - name: Set up Docker
        uses: docker/setup-buildx-action@v3

      - name: Run Docker Build
        shell: bash
        run: |
          chmod +x ./tools/make.sh
          ./tools/make.sh docker-build ${{ matrix.variant }}

      - name: Upload to Release
        uses: softprops/action-gh-release@v1
        with:
          files: build_${{ matrix.variant }}/installer/*
          tag_name: ${{ inputs.tag_name || '' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-windows:
    name: Build (Windows)
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag_name || github.ref }}
          submodules: recursive

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Create Environment
        run: |
          powershell -File ./tools/manage.ps1 create-env

      - name: Install Runtime Dependencies
        run: |
          powershell -File ./tools/manage.ps1 install-runtime

      - name: Build and Make Installer
        run: |
          powershell -File ./tools/manage.ps1 build-make-installer

      - name: Upload to Release
        uses: softprops/action-gh-release@v1
        with:
          files: build/installer/*
          tag_name: ${{ inputs.tag_name || '' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-macos:
    name: Build (macOS)
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag_name || github.ref }}
          submodules: recursive

      - name: Install Homebrew dependencies
        run: brew install cmake create-dmg

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Import code signing certificate
        if: ${{ github.event_name == 'release' || inputs.enable_macos_signing == true }}
        uses: apple-actions/import-codesign-certs@v3
        with:
          p12-file-base64: ${{ secrets.APPLE_DEVELOPER_ID_CERTIFICATE }}
          p12-password: ${{ secrets.APPLE_DEVELOPER_ID_PASSWORD }}

      - name: Set up notarization keychain profile
        if: ${{ github.event_name == 'release' || inputs.enable_macos_signing == true }}
        env:
          APPLE_NOTARIZE_APPLE_ID: ${{ secrets.APPLE_NOTARIZE_APPLE_ID }}
          APPLE_NOTARIZE_PASSWORD: ${{ secrets.APPLE_NOTARIZE_PASSWORD }}
          APPLE_NOTARIZE_TEAM_ID: ${{ secrets.APPLE_NOTARIZE_TEAM_ID }}
        run: |
          xcrun notarytool store-credentials "ayon-notarize-ci" \
            --apple-id "$APPLE_NOTARIZE_APPLE_ID" \
            --password "$APPLE_NOTARIZE_PASSWORD" \
            --team-id "$APPLE_NOTARIZE_TEAM_ID"

      - name: Create environment
        run: |
          chmod +x ./tools/make.sh
          ./tools/make.sh create-env

      - name: Install runtime dependencies
        run: ./tools/make.sh install-runtime

      - name: Build and make installer
        env:
          AYON_APPLE_SIGN_IDENTITY: ${{ secrets.APPLE_SIGN_IDENTITY }}
          AYON_APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          AYON_APPLE_CODESIGN: ${{ (github.event_name == 'release' || inputs.enable_macos_signing == true) && '1' || '0' }}
          AYON_APPLE_NOTARIZE: ${{ (github.event_name == 'release' || inputs.enable_macos_signing == true) && '1' || '0' }}
          AYON_APPLE_NOTARIZE_KEYCHAIN_PROFILE: "ayon-notarize-ci"
        run: ./tools/make.sh build-make-installer

      - name: Upload to Release
        uses: softprops/action-gh-release@v1
        with:
          files: build/installer/*
          tag_name: ${{ inputs.tag_name || '' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-conda:
    name: Build (Conda)
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - uses: actions/checkout@v6
        with:
            ref: ${{ inputs.tag_name || github.ref }}
            submodules: recursive

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      # build for linux in docker, so we can build for rocky9
      # note: the current need for Conda packages is for Deadline Cloud workers,
      # which are based on Rocky Linux 9.
      - if: ${{ matrix.os == 'ubuntu-latest' }}
        uses: docker/setup-buildx-action@v3
        with:
          buildkitd-flags: --allow-insecure-entitlement security.insecure --allow-insecure-entitlement network.host
      - if: ${{ matrix.os == 'ubuntu-latest' }}
        run: |
          chmod +x ./tools/make.sh
          ./tools/make.sh docker-build rocky9
        # set the sha256 hash for the linux package in conda_recipe.yaml
      - if: ${{ matrix.os == 'ubuntu-latest' }}
        run: |
          sha256=$(sha256sum ./build_rocky9/installer/AYON-${{ inputs.tag_name }}-linux-rocky9.tar.gz | awk '{print $1}')
          echo "SHA256: $sha256"
          sed -i "s/sha256: .*/sha256: $sha256/" ./conda_recipe.yaml

      # on windows, we need to build first the executable,
      # extract it and then package it into a conda package.
      - if: ${{ matrix.os == 'windows-latest' }}
        run: |
          powershell -File ./tools/manage.ps1 create-env
          powershell -File ./tools/manage.ps1 install-runtime
          powershell -File ./tools/manage.ps1 build-make-installer
          ./build/installer/AYON-${{ inputs.tag_name }}-win-setup.exe /VERYSILENT /DIR=C:\ayon-launcher
          powershell Compress-Archive -Path C:\ayon-launcher\* -DestinationPath .\build\AYON-${{ inputs.tag_name }}-win.zip
        

      - if: ${{ matrix.os == 'ubuntu-latest' }}
        shell: bash
        # update the version and also the sha256 hash for the linux package in conda_recipe.yaml
        run: |
          sed -i "s/version: .*/version: ${{ inputs.tag_name }}/" ./conda_recipe.yaml
          
      - if: ${{ matrix.os == 'windows-latest' }}
        shell: powershell
        run: |
          (Get-Content ./conda_recipe.yaml) -replace 'version: .*', "version: ${{ inputs.tag_name }}" | Set-Content ./conda_recipe.yaml
      - name: Build conda package
        uses: prefix-dev/rattler-build-action@v0.2.39
        with:
        # needs to be unique for each matrix entry
          artifact-name: package-${{ matrix.os }}
          build-args: --target-platform ${{ matrix.os }} --recipe ./conda_recipe.yaml
  
      - name: Set up AWS credentials
        uses: aws-actions/configure-aws-credentials@v3
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-central-1
      - name: Upload to S3
        run: |
          aws s3 cp output/linux-64/ayon-launcher-*.conda s3://${{ vars.S3_BUCKET_CONDA }}/Conda/Default/linux-64/
          aws s3 cp output/win-64/ayon-launcher-*.conda s3://${{ vars.S3_BUCKET_CONDA }}/Conda/Default/win-64/
